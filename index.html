<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lectio — Notícias, Palavra do Dia e Livros</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            marca: {
              50:  '#EFF6FF',
              100: '#DBEAFE',
              200: '#BFDBFE',
              300: '#93C5FD',
              400: '#60A5FA',
              500: '#3B82F6',
              600: '#2563EB',
              700: '#1D4ED8',
              800: '#1E40AF',
              900: '#1E3A5F',
              950: '#172554',
            },
            destaque: '#F59E0B',
          },
          fontFamily: {
            display: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            body:    ['"DM Sans"', 'system-ui', 'sans-serif'],
          },
          boxShadow: {
            'card':    '0 1px 3px rgba(30,58,95,0.06), 0 1px 2px rgba(30,58,95,0.04)',
            'card-md': '0 4px 12px rgba(30,58,95,0.08), 0 2px 4px rgba(30,58,95,0.04)',
            'elevated':'0 8px 24px rgba(30,58,95,0.12), 0 2px 8px rgba(30,58,95,0.06)',
            'nav':     '0 -2px 12px rgba(30,58,95,0.08)',
          },
          borderRadius: {
            'card': '14px',
            'btn':  '12px',
            'pill': '24px',
          },
        },
      },
    };
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: #0F172A;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    /* ── phone frame ── */
    #app-frame {
      width: 100%;
      max-width: 390px;
      height: 100vh;
      max-height: 844px;
      background: #F8FAFC;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 60px rgba(0,0,0,0.4);
    }
    @media (min-width: 450px) {
      #app-frame {
        border-radius: 44px;
        height: 844px;
        border: 8px solid #1a1a2e;
      }
    }
    @media (max-width: 449px) {
      #app-frame {
        border-radius: 0;
        height: 100vh;
        max-height: 100dvh;
      }
    }

    /* ── status bar ── */
    #status-bar {
      flex-shrink: 0;
      height: 48px;
      background: #F8FAFC;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 28px 8px;
      font-size: 13px;
      font-weight: 600;
      color: #1E3A5F;
      z-index: 60;
    }

    /* ── content area ── */
    #content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      position: relative;
    }
    #content::-webkit-scrollbar { width: 0; display: none; }

    /* ── screen transitions ── */
    [data-tela] { animation: fadeSlide 0.28s ease-out; }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── active nav ── */
    .nav-btn.ativo {
      color: #2563EB;
    }
    .nav-btn.ativo::after {
      content: '';
      display: block;
      width: 20px;
      height: 3px;
      background: #2563EB;
      border-radius: 2px;
      margin: 2px auto 0;
    }
    .nav-btn {
      color: #94A3B8;
      transition: color 0.2s ease;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }

    /* ── bottom tab bar ── */
    #tab-bar {
      flex-shrink: 0;
      height: 68px;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(30,58,95,0.08);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 4px 0 8px;
      z-index: 50;
      box-shadow: 0 -1px 8px rgba(30,58,95,0.04);
    }
    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 10px;
      font-weight: 500;
      padding: 4px 10px;
      border: none;
      background: none;
      outline: none;
    }
    .nav-btn svg { width: 22px; height: 22px; }
    .nav-btn:active { opacity: 0.6; transform: scale(0.94); transition: transform 0.1s; }

    /* ── utilities ── */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .card {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 1px 3px rgba(30,58,95,0.06), 0 1px 2px rgba(30,58,95,0.04);
      overflow: hidden;
      transition: box-shadow 0.2s ease, transform 0.2s ease;
    }
    .card:active { transform: scale(0.985); }
    .card-elevated {
      box-shadow: 0 8px 24px rgba(30,58,95,0.12), 0 2px 8px rgba(30,58,95,0.06);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 24px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 15px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: 'DM Sans', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: #2563EB; color: #fff;
      box-shadow: 0 2px 8px rgba(37,99,235,0.3);
    }
    .btn-primary:hover { background: #1D4ED8; }
    .btn-outline {
      background: transparent; color: #2563EB;
      border: 2px solid #2563EB;
    }
    .btn-outline:hover { background: #EFF6FF; }
    .btn-dark {
      background: #1E3A5F; color: #fff;
      box-shadow: 0 2px 8px rgba(30,58,95,0.3);
    }
    .btn-sm { padding: 8px 16px; font-size: 13px; border-radius: 10px; }
    .btn-full { width: 100%; }

    /* ── focus ── */
    button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 3px solid #2563EB;
      outline-offset: 2px;
      border-radius: 8px;
    }

    /* ── scrollbar ── */
    ::-webkit-scrollbar { width: 0; height: 0; }

    /* ── toasts ── */
    #toast-area {
      position: absolute;
      top: 56px;
      left: 16px; right: 16px;
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast-item {
      padding: 12px 18px;
      border-radius: 12px;
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      font-family: 'DM Sans', system-ui, sans-serif;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: toastIn 0.35s ease-out;
      pointer-events: auto;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    }
    .toast-item.toast-out { animation: toastOut 0.3s ease-in forwards; }
    .toast-ok    { background: #059669; }
    .toast-erro  { background: #DC2626; }
    .toast-info  { background: #2563EB; }
    @keyframes toastIn  { from { opacity:0; transform:translateY(-14px) scale(0.95); } to { opacity:1; transform:translateY(0) scale(1); } }
    @keyframes toastOut { from { opacity:1; transform:translateY(0) scale(1); } to { opacity:0; transform:translateY(-14px) scale(0.9); } }

    /* ── modal ── */
    #modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(15,23,42,0.55);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 150;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      animation: fadeIn 0.2s ease;
    }
    @media (min-width: 450px) {
      #modal-backdrop { align-items: center; }
    }
    #modal-card {
      background: #fff;
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-height: 75%;
      overflow-y: auto;
      padding: 24px 20px 32px;
      animation: modalSlide 0.3s ease-out;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.15);
    }
    @media (min-width: 450px) {
      #modal-card {
        border-radius: 20px;
        width: 340px;
        max-height: 80%;
        max-width: 90%;
      }
    }
    @keyframes fadeIn  { from { opacity:0; } to { opacity:1; } }
    @keyframes modalSlide { from { opacity:0; transform:translateY(40px); } to { opacity:1; transform:translateY(0); } }

    /* ── book cover placeholder ── */
    .book-cover {
      aspect-ratio: 3/4;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
      box-shadow: 4px 4px 12px rgba(0,0,0,0.2);
      position: relative;
      overflow: hidden;
    }
    .book-cover::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 14px;
      background: rgba(0,0,0,0.15);
    }
    .book-cover::after {
      content: '';
      position: absolute;
      left: 14px; top: 0; bottom: 0;
      width: 2px;
      background: rgba(255,255,255,0.15);
    }

    /* ── avatar ── */
    .avatar {
      width: 44px; height: 44px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700;
      font-size: 16px;
      color: #fff;
      flex-shrink: 0;
    }

    /* ── input ── */
    .input-field {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #E2E8F0;
      border-radius: 12px;
      font-size: 15px;
      font-family: 'DM Sans', system-ui, sans-serif;
      color: #1E3A5F;
      background: #fff;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      outline: none;
    }
    .input-field:focus {
      border-color: #2563EB;
      box-shadow: 0 0 0 4px rgba(37,99,235,0.1);
    }
    .input-field::placeholder { color: #94A3B8; }

    /* ── hero gradient ── */
    .hero-gradient {
      background: linear-gradient(135deg, #1E3A5F 0%, #2563EB 100%);
    }

    /* ── section heading ── */
    .section-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 700;
      color: #1E3A5F;
    }
  </style>
</head>

<body class="bg-slate-900">

  <div id="app-frame">

    <!-- ══════════════ STATUS BAR ══════════════ -->
    <div id="status-bar">
      <span id="clock">09:41</span>
      <svg width="68" height="16" viewBox="0 0 68 16" fill="none">
        <path d="M2 12L5.5 8.5L2 5" stroke="#1E3A5F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="10" y="5.5" width="38" height="5" rx="1.5" stroke="#1E3A5F" stroke-width="1.2"/>
        <rect x="12" y="6.7" width="24" height="2.6" rx="1" fill="#1E3A5F"/>
        <path d="M53 7.5V8.5C55.2091 8.5 57 10.2909 57 12.5V12.5C57 14.7091 55.2091 16.5 53 16.5V16.5C50.7909 16.5 49 14.7091 49 12.5V12.5C49 10.2909 50.7909 8.5 53 7.5V7.5Z" stroke="#1E3A5F" stroke-width="1.2" fill="none"/>
        <rect x="53.5" y="10" width="4" height="2.5" rx="0.5" fill="#1E3A5F"/>
      </svg>
    </div>

    <!-- ══════════════ CONTENT ══════════════ -->
    <div id="content">

      <!-- ══ TOAST AREA ══ -->
      <div id="toast-area"></div>

      <!-- ══ MODAL OVERLAY (oculto) ══ -->
      <div id="modal-backdrop" class="hidden" onclick="fecharModal()"></div>
      <div id="modal-card"></div>

      <!-- ═══════════════════════════════════ -->
      <!--          TELAS                     -->
      <!-- ═══════════════════════════════════ -->
      <!-- TELAS -->

    </div>

    <!-- ══════════════ TAB BAR ══════════════ -->
    <nav id="tab-bar" aria-label="Navegação principal">
      <button class="nav-btn ativo" data-nav="pagina-inicial" onclick="mostrarTela('pagina-inicial')" aria-label="Página Inicial">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Início
      </button>
      <button class="nav-btn" data-nav="detalhe-da-noticia" onclick="mostrarTela('detalhe-da-noticia')" aria-label="Notícias">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><polyline points="22 6 12 13 2 6"/></svg>
        Notícias
      </button>
      <button class="nav-btn" data-nav="palavra-do-dia" onclick="mostrarTela('palavra-do-dia')" aria-label="Palavra do Dia">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
        Palavra
      </button>
      <button class="nav-btn" data-nav="catalogo-de-livros" onclick="mostrarTela('catalogo-de-livros')" aria-label="Catálogo de Livros">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        Livros
      </button>
      <button class="nav-btn" data-nav="meu-carrinho" onclick="mostrarTela('meu-carrinho')" aria-label="Meu Carrinho">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        Carrinho
      </button>
      <button class="nav-btn" data-nav="minha-biblioteca" onclick="mostrarTela('minha-biblioteca')" aria-label="Minha Biblioteca">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        Biblioteca
      </button>
    </nav>
  </div>

  <script>
    // ══════════════════════════════════
    //  UTILITÁRIOS GLOBAIS
    // ══════════════════════════════════

    function brl(valor) {
      return Intl.NumberFormat('pt-BR', { style:'currency', currency:'BRL' }).format(valor);
    }

    function dataBR(iso) {
      if (!iso) return '';
      var d = new Date(iso + 'T00:00:00');
      var dd = String(d.getDate()).padStart(2,'0');
      var mm = String(d.getMonth()+1).padStart(2,'0');
      var aa = d.getFullYear();
      return dd + '/' + mm + '/' + aa;
    }

    // ── Toasts ──
    function toast(mensagem, tipo) {
      tipo = tipo || 'info';
      var area = document.getElementById('toast-area');
      var el = document.createElement('div');
      el.className = 'toast-item toast-' + tipo;
      var icones = { ok:'✓', erro:'✕', info:'ℹ' };
      el.innerHTML = '<span>' + (icones[tipo]||'') + '</span><span>' + mensagem + '</span>';
      area.appendChild(el);
      setTimeout(function() {
        el.classList.add('toast-out');
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, 3000);
    }

    // ── Modal ──
    function abrirModal(html, titulo) {
      var backdrop = document.getElementById('modal-backdrop');
      var card = document.getElementById('modal-card');
      card.innerHTML =
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">' +
          '<h3 class="section-title text-xl">' + (titulo||'') + '</h3>' +
          '<button onclick="fecharModal()" style="background:none;border:none;cursor:pointer;padding:4px;color:#64748B;font-size:22px;line-height:1;">✕</button>' +
        '</div>' + html;
      backdrop.classList.remove('hidden');
    }
    function fecharModal() {
      document.getElementById('modal-backdrop').classList.add('hidden');
      document.getElementById('modal-card').innerHTML = '';
    }
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') fecharModal();
    });

    // ── Clock ──
    function atualizarRelogio() {
      var agora = new Date();
      var hh = String(agora.getHours()).padStart(2,'0');
      var mi = String(agora.getMinutes()).padStart(2,'0');
      var el = document.getElementById('clock');
      if (el) el.textContent = hh + ':' + mi;
    }
    atualizarRelogio();
    setInterval(atualizarRelogio, 30000);

    // ══════════════════════════════════
    //  ROTEADOR
    // ══════════════════════════════════

    function mostrarTela(id) {
      document.querySelectorAll('[data-tela]').forEach(function (s) {
        s.classList.toggle('hidden', s.dataset.tela !== id);
      });
      document.querySelectorAll('[data-nav]').forEach(function (b) {
        b.classList.toggle('ativo', b.dataset.nav === id);
      });
      window.scrollTo({ top: 0 });
    }

    document.addEventListener('DOMContentLoaded', function () {
      mostrarTela('pagina-inicial');
    });
  </script>
</body>
</html>
